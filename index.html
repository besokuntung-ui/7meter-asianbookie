  <style amp-custom>
    body {
      font-family: 'Open Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #000;
      color: #54026e;
      background-image: radial-gradient(#060028 5%, transparent 50%);
      background-size: 3px 3px;
    }
    header, footer {
      width: 100%;
      text-align: center;
      padding: 10px;
    }
    .logo {
      max-width: 150px;
      margin: 10px 0;
      filter: drop-shadow(0 0 10px #ffffff) drop-shadow(0 0 20px #ffffff);
    }

    /* Marquee */
    .marquee-container {
      width: 320px;
      overflow: hidden;
      white-space: nowrap;
      box-sizing: border-box;
      border: 2px solid #54026e;
      border-radius: 5px;
      margin: 15px 0;
      background-color: #000;
      animation: glowBorder 2s infinite alternate;
    }
    .marquee {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 12s linear infinite;
      color: #ffffff;
      font-weight: bold;
      text-shadow: 0 0 5px #54026e, 0 0 15px #54026e;
    }
    @keyframes marquee {
      0% { transform: translate(0,0); }
      100% { transform: translate(-100%,0); }
    }
    @keyframes glowBorder {
      0% { box-shadow: 0 0 10px #54026e; }
      50% { box-shadow: 0 0 25px #54026e; }
      100% { box-shadow: 0 0 10px #54026e; }
    }

    .banner {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
}

.banner {
  max-width: 300px;
  width: 100%;
  margin: 15px auto;
  border-radius: 15px;
  box-shadow: 0 0 25px #54026e;
  animation: floatBanner 3s ease-in-out infinite alternate;
  } @keyframes floatBanner { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }



    /* Buttons */
    .buttons {
      display: flex;
      justify-content: center;
      width: 100%;
      max-width: 320px;
      gap: 10px;
      margin-bottom: 25px;
    }
    .button {
      flex: 1;
      font-size: 16px;
      font-weight: 700;
      padding: 14px 0;
      color: #54026e;
      border: none;
      border-radius: 12px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.35);
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      text-align: center;
      text-decoration: none;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      background: linear-gradient(135deg,#000,#000);
      box-shadow: 0 6px 0 #54026e, 0 12px 20px rgba(223, 15, 1, 0.35);
      animation: buttonGlow 2s infinite alternate;
    }
    .button:hover {
      top: -2px;
      box-shadow: 0 4px 0 #54026e, 0 10px 15px #54026e;
    }
    @keyframes buttonGlow {
      0% { box-shadow: 0 6px 0 #54026e, 0 12px 20px rgba(223, 15, 1, 0.35); }
      50% { box-shadow: 0 6px 0 #54026e, 0 12px 25px rgba(255,215,0,0.6); }
      100% { box-shadow: 0 6px 0 #54026e, 0 12px 20px rgba(223, 15, 1, 0.35); }
    }

    /* Footer */
    footer p {
      font-weight: 400;
      color: #54026e;
      text-shadow: 0 0 5px #54026e, 0 0 10px #54026e;
    }
    footer a {
      font-weight: 700;
      color: #54026e;
      text-decoration: none;
      text-shadow: 0 0 5px #54026e, 0 0 10px #54026e;
    }
    /* CTA WRAPPER */
.cta-buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 20px auto;
  width: 100%;
  max-width: 320px; /* biar pas di tengah */
}

/* CTA BUTTONS */
.cta-buttons a {
  flex: 1 1 45%;
  text-align: center;
  background: linear-gradient(145deg, #000000, #54026e, #000000);
  border: 2px solid #54026e;
  color: #ffffff;
  text-decoration: none;
  font-weight: bold;
  font-size: 16px;
  border-radius: 8px;
  padding: 10px 0;
  box-shadow: 0 0 10px rgba(255, 30, 0, 0.6);
  transition: all 0.3s ease;
}

/* Hover */
.cta-buttons a:hover {
  background: #54026e;
  color: #000;
  box-shadow: 0 0 15px rgb(255, 230, 0);
}

/* RESPONSIVE FIX: Kalau layar kecil banget */
@media (max-width: 400px) {
  .cta-buttons a {
    flex: 1 1 100%;
  }
}
